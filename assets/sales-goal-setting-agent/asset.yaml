apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: sales-goal-setting-agent
  description: AI agent that guides sales representatives through quarterly development objective creation by retrieving CRM territory data from SAP Sales Cloud and employee profile and goals from SAP SuccessFactors, recommending relevant goals, and creating or updating them upon confirmation.

provides:
  apis:
    - name: sales-goal-setting-agent
      kind: a2a
      ordId: customer.build:apiResource:sales-goal-setting-agent-8b2a7.sales-goal-setting-agent:v1

container:
  buildPath: .
  port: 5000

requires:
  - name: sap-sf-performanceandgoalspmgm-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:sales-goal-setting-agent-8b2a7.sap-sf-performanceandgoalspmgm-mcp-server:v1
  - name: sap-sf-ecemployeeprofile-mcp-server
    kind: mcp-server
    ordId: customer.build:apiResource:sales-goal-setting-agent-8b2a7.sap-sf-ecemployeeprofile-mcp-server:v1
  # SAP Sales Cloud custom MCP server - ORD ID must be updated once the custom server is deployed
  # This server exposes territory, accounts, leads, opportunities, and performance history tools
  # - name: sap-sales-cloud-crm-mcp-server
  #   kind: mcp-server
  #   ordId: <TO BE PROVIDED - custom SAP Sales Cloud MCP server ORD ID>

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
